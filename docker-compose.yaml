# example docker compose
services:
    db:
        image: postgres:17-alpine
        restart: always
        shm_size: 128mb
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin # modify password before running
            POSTGRES_PORT: 5432
            POSTGRES_DB: app
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - postgresql:/var/lib/postgresql/data
        ports:
            - 5432:5432
    backend:
        image: ghcr.io/apollodaniel/shrt_link_backend:latest
        build: .
        depends_on:
            - db
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin # modify password before running
            POSTGRES_PORT: 5432
            POSTGRES_DB: app
            POSTGRES_HOST: db
            JWT_AUTHT_EXPIRESIN: 1800
            JWT_AUTHT_KEY: jauthkey123 # change this value before running
            JWT_REFRESHT_KEY: jrefreshkey123 # change this value before running
            COOKIE_ENCRIPTION_KEY: cookiekey123 # change this value before running
            FRONTEND_ORIGIN: http://localhost:5173
            EXPRESS_PORT: 8080
            # only for testing environments: this forces the server to always get his ip instead of user real ip, and also a fake user agent
            # DISABLE FOR PRODUCTION
            TEST_ENVIRONMENT: true
            # provides static ip for test_environment
            TEST_IP: 8.8.8.8
            TEST_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/67.0.3396 Safari/537.36"

        ports:
            - 8080:8080
volumes:
    postgresql:
