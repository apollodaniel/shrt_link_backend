name: ci-develop-workflow
on:
    pull_request:
        types:
          - opened
        branches:
            - develop
    workflow_dispatch:
        branches:
            - develop
jobs:
    run-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Yarn setup
              uses: DerYeger/yarn-setup-action@master
              with:
                node-version: 22.10
            - name: Setup dependencies
              run: sudo apt update && sudo apt install -y telnet bash gawk grep
            - name: Pull images
              run: docker compose pull db
            - name: Start PostgreSQL with Docker Compose
              run: docker compose up db -d
            - name: "Run tests"
              run: POSTGRES_HOST="localhost" POSTGRES_PORT=5432 ./entrypoint.sh yarn test # verify if all tests are ok before allow pr
