name: ci-develop-workflow
on:
    pull_request:
        branches:
            - develop
jobs:
    run-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Yarn setup
              uses: DerYeger/yarn-setup-action@master
              with:
                node-version: 22.10
            - name: "Install dockerize"
              run: apt-get update && apt-get install -y wget && wget -O - https://github.com/jwilder/dockerize/releases/download/v0.9.3/dockerize-linux-amd64-v0.9.3.tar.gz | tar xzf - -C /usr/local/bin && apt-get autoremove -yqq --purge wget && rm -rf /var/lib/apt/lists/*
            - name: Pull images
              run: docker compose pull db
            - name: Start PostgreSQL with Docker Compose
              run: docker compose up db -d
            - name: "Run tests"
              run: /usr/local/bin/dockerize -wait tcp://localhost:5432 yarn test # verify if all tests are ok before allow pr
